name: Device tests

# Runs the app on an Android emulator: the real player with the tape in its audio path, and the
# whole screen driven the way a person would. Screenshots are uploaded so the result can be looked at.
on:
  workflow_dispatch:
  push:
    branches: ["ccr-**"]

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            adb logcat -c
            adb shell am instrument -w dev.foldman.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee instrument.txt || true
            adb logcat -d > logcat.txt || true
            mkdir -p shots
            adb pull /sdcard/Android/data/dev.foldman/files/shots/. shots/ || true
            adb shell wm size || true

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-results
          path: |
            shots
            instrument.txt
            logcat.txt
          if-no-files-found: warn

      - name: The tests must have passed
        run: |
          cat instrument.txt | tail -40
          grep -q "^OK (" instrument.txt
          ! grep -q "FATAL EXCEPTION" logcat.txt
